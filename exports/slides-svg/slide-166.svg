true" role="heading" aria-level="3"><text color="rgb(10, 10, 11)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="40px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="-0.88px" text-decoration="none solid rgb(10, 10, 11)" text-anchor="start" text-rendering="auto" unicode-bidi="isolate" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(10, 10, 11)"><tspan xml:space="preserve" x="132" y="303" textLength="375.5625" lengthAdjust="spacingAndGlyphs">La conversación sobre </tspan><tspan xml:space="preserve" x="132" y="345" textLength="376.765625" lengthAdjust="spacingAndGlyphs">CNET ha cambiado. La </tspan><tspan xml:space="preserve" x="132" y="387" textLength="260.96875" lengthAdjust="spacingAndGlyphs">marca, también.</tspan></text></g><g data-tag="p" id="lede1" class="lede lede--quiet" data-z-index="auto" data-stacking-context="true"><text color="rgb(107, 107, 114)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="17px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="-0.136px" text-decoration="none solid rgb(107, 107, 114)" text-anchor="start" text-rendering="auto" unicode-bidi="isolate" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(107, 107, 114)"><tspan xml:space="preserve" x="132" y="483" textLength="454.125" lengthAdjust="spacingAndGlyphs">Estas tres ideas resumen la totalidad del benchmark — y son la </tspan><tspan xml:space="preserve" x="132" y="508.5" textLength="436.34375" lengthAdjust="spacingAndGlyphs">base sobre la que se apoyan los principios y los territorios de </tspan><tspan xml:space="preserve" x="132" y="534" textLength="284.4375" lengthAdjust="spacingAndGlyphs">oportunidad que vienen a continuación.</tspan></text></g></g><g data-tag="div" id="col2" class="col gap-16" data-z-index="auto" data-stacking-context="true" aria-owns="insight1 insight2 insight3"><g data-tag="div" id="insight1" class="insight" data-z-index="auto" data-stacking-context="true" aria-owns="insight__n1 insight__t1 insight__d1"><g data-stacking-layer="rootBackgroundAndBorders"><rect width="616.40625" height="171.1875" x="651.59375" y="184" fill="rgb(255, 255, 255)" stroke="rgba(10, 10, 11, 0.14)" stroke-width="1px" rx="8" ry="8"/></g><g data-tag="span" id="insight__n1" class="insight__n" data-z-index="auto" data-stacking-context="true"><text color="rgb(107, 107, 114)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="10px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="0.8px" text-decoration="none solid rgb(107, 107, 114)" text-anchor="start" text-rendering="auto" unicode-bidi="normal" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(107, 107, 114)"><tspan xml:space="preserve" x="674.59375" y="219" textLength="41.859375" lengthAdjust="spacingAndGlyphs">TAKE 01</tspan></text></g><g data-tag="div" id="insight__t1" class="insight__t" data-z-index="auto" data-stacking-context="true"><text color="rgb(10, 10, 11)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="16px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="-0.16px" text-decoration="none solid rgb(10, 10, 11)" text-anchor="start" text-rendering="auto" unicode-bidi="isolate" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(10, 10, 11)"><tspan xml:space="preserve" x="674.59375" y="246" textLength="335.109375" lengthAdjust="spacingAndGlyphs">El marketplace VO se polariza: ruido vs. confianza.</tspan></text></g><g data-tag="p" id="insight__d1" class="insight__d" data-z-index="auto" data-stacking-context="true"><text color="rgb(107, 107, 114)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="-0.024px" text-decoration="none solid rgb(107, 107, 114)" text-anchor="start" text-rendering="auto" unicode-bidi="isolate" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(107, 107, 114)"><tspan xml:space="preserve" x="674.59375" y="282.1875" textLength="551.203125" lengthAdjust="spacingAndGlyphs">A un lado, plataformas low-trust (Milanuncios, Wallapop) que ganan con velocidad. Al otro, dealers verticales </tspan><tspan xml:space="preserve" x="674.59375" y="300.1875" textLength="550.359375" lengthAdjust="spacingAndGlyphs">(AutoHero, Clicars) que ganan con control. CNET ocupa un terreno intermedio que no es perezoso — es de </tspan><tspan xml:space="preserve" x="674.59375" y="318.1875" textLength="73.359375" lengthAdjust="spacingAndGlyphs">alta exigencia.</tspan></text></g></g><g data-tag="div" id="insight2" class="insight insight--blue" data-z-index="auto" data-stacking-context="true" aria-owns="insight__n2 insight__t2 insight__d2"><g data-stacking-layer="rootBackgroundAndBorders"><rect width="616.40625" height="153.1875" x="651.59375" y="371.1875" fill="rgb(31, 63, 255)" stroke="rgb(31, 63, 255)" stroke-width="1px" rx="8" ry="8"/></g><g data-tag="span" id="insight__n2" class="insight__n" data-z-index="auto" data-stacking-context="true"><text color="rgba(255, 255, 255, 0.78)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="10px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="0.8px" text-decoration="none solid rgba(255, 255, 255, 0.78)" text-anchor="start" text-rendering="auto" unicode-bidi="normal" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgba(255, 255, 255, 0.78)"><tspan xml:space="preserve" x="674.59375" y="406.1875" textLength="44.140625" lengthAdjust="spacingAndGlyphs">TAKE 02</tspan></text></g><g data-tag="div" id="insight__t2" class="insight__t" data-z-index="auto" data-stacking-context="true"><text color="rgb(255, 255, 255)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="16px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="-0.16px" text-decoration="none solid rgb(255, 255, 255)" text-anchor="start" text-rendering="auto" unicode-bidi="isolate" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(255, 255, 255)"><tspan xml:space="preserve" x="674.59375" y="433.1875" textLength="314.296875" lengthAdjust="spacingAndGlyphs">El comprador llega con vocabulario importado.</tspan></text></g><g data-tag="p" id="insight__d2" class="insight__d" data-z-index="auto" data-stacking-context="true"><text color="rgba(255, 255, 255, 0.78)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="-0.024px" text-decoration="none solid rgba(255, 255, 255, 0.78)" text-anchor="start" text-rendering="auto" unicode-bidi="isolate" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgba(255, 255, 255, 0.78)"><tspan xml:space="preserve" x="674.59375" y="469.375" textLength="549.765625" lengthAdjust="spacingAndGlyphs">Espera reviews granulares (Airbnb), precio total (Revolut), grados de producto (Back Market), estado en vivo </tspan><tspan xml:space="preserve" x="674.59375" y="487.375" textLength="532.765625" lengthAdjust="spacingAndGlyphs">(Cabify) y narrativa editorial (Stripe). Si no los encuentra, percibe a CNET como antiguo, no como neutral.</tspan></text></g></g><g data-tag="div" id="insight3" class="insight" data-z-index="auto" data-stacking-context="true" aria-owns="insight__n3 insight__t3 insight__d3"><g data-stacking-layer="rootBackgroundAndBorders"><rect width="616.40625" height="153.1875" x="651.59375" y="540.375" fill="rgb(255, 255, 255)" stroke="rgba(10, 10, 11, 0.14)" stroke-width="1px" rx="8" ry="8"/></g><g data-tag="span" id="insight__n3" class="insight__n" data-z-index="auto" data-stacking-context="true"><text color="rgb(107, 107, 114)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="10px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="0.8px" text-decoration="none solid rgb(107, 107, 114)" text-anchor="start" text-rendering="auto" unicode-bidi="normal" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(107, 107, 114)"><tspan xml:space="preserve" x="674.59375" y="575.375" textLength="44.46875" lengthAdjust="spacingAndGlyphs">TAKE 03</tspan></text></g><g data-tag="div" id="insight__t3" class="insight__t" data-z-index="auto" data-stacking-context="true"><text color="rgb(10, 10, 11)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="16px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="-0.16px" text-decoration="none solid rgb(10, 10, 11)" text-anchor="start" text-rendering="auto" unicode-bidi="isolate" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(10, 10, 11)"><tspan xml:space="preserve" x="674.59375" y="602.375" textLength="396.484375" lengthAdjust="spacingAndGlyphs">Hay un asiento vacío: el marketplace VO premium europeo.</tspan></text></g><g data-tag="p" id="insight__d3" class="insight__d" data-z-index="auto" data-stacking-context="true"><text color="rgb(107, 107, 114)" dominant-baseline="text-after-edge" font-family="&quot;PP Neue Montreal&quot;, &quot;Neue Montreal&quot;, Inter, &quot;SF Pro Display&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="12px" font-size-adjust="none" font-stretch="100%" font-style="normal" font-variant="normal" font-weight="500" direction="ltr" letter-spacing="-0.024px" text-decoration="none solid rgb(107, 107, 114)" text-anchor="start" text-rendering="auto" unicode-bidi="isolate" word-spacing="0px" writing-mode="horizontal-tb" user-select="auto" fill="rgb(107, 107, 114)"><tspan xml:space="preserve" x="674.59375" y="638.5625" textLength="555.59375" lengthAdjust="spacingAndGlyphs">Nadie ocupa la combinación marketplace+sofisticación+confianza+editorial. Es el territorio más natural para </tspan><tspan xml:space="preserve" x="674.59375" y="656.5625" textLength="415.5625" lengthAdjust="spacingAndGlyphs">CNET porque ya tiene la oferta, los datos y la audiencia. Falta dirección de marca.</tspan></text></g></g></g></g></g></svg>